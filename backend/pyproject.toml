[project]
name = "aucoff-backend"
version = "0.1.0"
description = "AUCoFF FastAPI gateway and agent services (see specs/backend-spec.md)"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aio-pika>=10.1.1",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pip-licenses>=5.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/db/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs Docker (starts a throwaway PostgreSQL 18 container)"]
