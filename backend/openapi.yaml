components:
  schemas:
    EvidenceItem:
      properties:
        collected_at:
          format: date
          title: Collected At
          type: string
        fresh:
          description: Collected within its freshness window.
          title: Fresh
          type: boolean
        id:
          examples:
          - E-0001
          title: Id
          type: string
        source:
          enum:
          - aws
          - kubernetes
          - github
          - entra
          - upload
          title: Source
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - source
      - collected_at
      - fresh
      title: EvidenceItem
      type: object
    Finding:
      properties:
        age_days:
          title: Age Days
          type: integer
        control_id:
          title: Control Id
          type: string
        first_seen:
          format: date
          title: First Seen
          type: string
        framework_id:
          title: Framework Id
          type: string
        id:
          examples:
          - F-0001
          title: Id
          type: string
        severity:
          enum:
          - critical
          - high
          - medium
          - low
          title: Severity
          type: string
        status:
          enum:
          - open
          - in_progress
          - accepted_risk
          - resolved
          title: Status
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - severity
      - status
      - framework_id
      - control_id
      - first_seen
      - age_days
      title: Finding
      type: object
    FrameworkCoverage:
      properties:
        coverage_pct:
          title: Coverage Pct
          type: number
        delta_vs_previous:
          title: Delta Vs Previous
          type: number
        framework_id:
          examples:
          - soc2-2017
          title: Framework Id
          type: string
        name:
          examples:
          - SOC 2 (Common Criteria)
          title: Name
          type: string
      required:
      - framework_id
      - name
      - coverage_pct
      - delta_vs_previous
      title: FrameworkCoverage
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthStatus:
      properties:
        service:
          description: Service name.
          examples:
          - aucoff-gateway
          title: Service
          type: string
        status:
          description: '`ok` when the checks pass.'
          examples:
          - ok
          title: Status
          type: string
        version:
          description: Service version.
          examples:
          - 0.1.0
          title: Version
          type: string
      required:
      - status
      - service
      - version
      title: HealthStatus
      type: object
    Kpi:
      properties:
        delta_vs_previous:
          description: Change since the previous scan.
          examples:
          - 2.1
          title: Delta Vs Previous
          type: number
        value:
          description: Current value.
          examples:
          - 78.4
          title: Value
          type: number
      required:
      - value
      - delta_vs_previous
      title: Kpi
      type: object
    Kpis:
      properties:
        coverage_pct:
          $ref: '#/components/schemas/Kpi'
          description: Share of in-scope controls with a result (M-02).
        evidence_freshness_pct:
          $ref: '#/components/schemas/Kpi'
          description: Evidence collected within its window (M-09).
        open_findings:
          $ref: '#/components/schemas/Kpi'
          description: Open findings across severities (M-06).
        pending_approvals:
          $ref: '#/components/schemas/Kpi'
          description: Results waiting for human approval (M-14).
        posture_score:
          $ref: '#/components/schemas/Kpi'
          description: Overall compliance posture score, 0-100 (M-01).
      required:
      - posture_score
      - coverage_pct
      - open_findings
      - pending_approvals
      - evidence_freshness_pct
      title: Kpis
      type: object
    Page_EvidenceItem_:
      properties:
        data_source:
          description: '`synthetic` marks demo rows that are not real results.'
          enum:
          - synthetic
          - catalogue
          - assessments
          title: Data Source
          type: string
        items:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Pass as `cursor` for the next page; null at the end.
          title: Next Cursor
      required:
      - items
      - next_cursor
      - data_source
      title: Page[EvidenceItem]
      type: object
    Page_Finding_:
      properties:
        data_source:
          description: '`synthetic` marks demo rows that are not real results.'
          enum:
          - synthetic
          - catalogue
          - assessments
          title: Data Source
          type: string
        items:
          items:
            $ref: '#/components/schemas/Finding'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Pass as `cursor` for the next page; null at the end.
          title: Next Cursor
      required:
      - items
      - next_cursor
      - data_source
      title: Page[Finding]
      type: object
    Page_UnifiedControl_:
      properties:
        data_source:
          description: '`synthetic` marks demo rows that are not real results.'
          enum:
          - synthetic
          - catalogue
          - assessments
          title: Data Source
          type: string
        items:
          items:
            $ref: '#/components/schemas/UnifiedControl'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Pass as `cursor` for the next page; null at the end.
          title: Next Cursor
      required:
      - items
      - next_cursor
      - data_source
      title: Page[UnifiedControl]
      type: object
    PostureDashboard:
      properties:
        data_source:
          description: '`synthetic` means demo numbers, not real results.'
          enum:
          - synthetic
          - assessments
          title: Data Source
          type: string
        frameworks:
          items:
            $ref: '#/components/schemas/FrameworkCoverage'
          title: Frameworks
          type: array
        kpis:
          $ref: '#/components/schemas/Kpis'
        severity_comparison:
          items:
            $ref: '#/components/schemas/SeverityComparison'
          title: Severity Comparison
          type: array
        status_distribution:
          $ref: '#/components/schemas/StatusDistribution'
      required:
      - data_source
      - kpis
      - status_distribution
      - severity_comparison
      - frameworks
      title: PostureDashboard
      type: object
    RequirementRef:
      properties:
        framework:
          examples:
          - soc2-2017
          title: Framework
          type: string
        ref:
          examples:
          - CC6.1
          title: Ref
          type: string
      required:
      - framework
      - ref
      title: RequirementRef
      type: object
    SeverityComparison:
      properties:
        before_previous:
          description: Same, two scans before the latest.
          title: Before Previous
          type: integer
        latest:
          description: Failing controls of this severity in the latest scan.
          title: Latest
          type: integer
        previous:
          description: Same, in the scan before the latest.
          title: Previous
          type: integer
        severity:
          enum:
          - critical
          - high
          - medium
          - low
          title: Severity
          type: string
      required:
      - severity
      - latest
      - previous
      - before_previous
      title: SeverityComparison
      type: object
    StatusDistribution:
      properties:
        fail:
          title: Fail
          type: integer
        not_applicable:
          title: Not Applicable
          type: integer
        partial:
          title: Partial
          type: integer
        pass:
          description: Controls passing.
          title: Pass
          type: integer
        unknown:
          title: Unknown
          type: integer
      required:
      - pass
      - partial
      - fail
      - unknown
      - not_applicable
      title: StatusDistribution
      type: object
    UnifiedControl:
      properties:
        check_type:
          enum:
          - automated
          - manual
          - hybrid
          title: Check Type
          type: string
        description:
          title: Description
          type: string
        domain:
          title: Domain
          type: string
        id:
          examples:
          - UC-IAM-001
          title: Id
          type: string
        requirements:
          items:
            $ref: '#/components/schemas/RequirementRef'
          title: Requirements
          type: array
        severity:
          enum:
          - critical
          - high
          - medium
          - low
          title: Severity
          type: string
        status:
          enum:
          - draft
          - approved
          title: Status
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - description
      - domain
      - severity
      - check_type
      - status
      - requirements
      title: UnifiedControl
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      description: OIDC access token
      scheme: bearer
      type: http
info:
  contact:
    name: AUCoFF maintainers
  description: AgenticAI Unified Compliance Framework for Fintechs. The OpenAPI document
    is the source of truth for the API contract (specs/api-contract.md). Every endpoint,
    including this documentation, requires a bearer token.
  title: AUCoFF API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/dashboards/posture:
    get:
      description: KPI strip, control status distribution, severity counts for the
        latest scan and the previous two, and coverage per framework, with deltas
        against the previous scan. Requires scope `report:read`. Until assessments
        exist the numbers are synthetic and `data_source` is `synthetic`.
      operationId: postureDashboard
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureDashboard'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Posture dashboard
      tags:
      - dashboards
  /api/v1/evidence:
    get:
      description: Evidence items (scope `evidence:read`), filterable by `source`.
        Until collectors run, rows are synthetic demo data and `data_source` is `synthetic`.
      operationId: listEvidence
      parameters:
      - description: Page size (default 25, maximum 100).
        in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size (default 25, maximum 100).
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Opaque cursor from a previous page.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from a previous page.
          title: Cursor
      - in: query
        name: source
        required: false
        schema:
          anyOf:
          - enum:
            - aws
            - kubernetes
            - github
            - entra
            - upload
            type: string
          - type: 'null'
          title: Source
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_EvidenceItem_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List evidence
      tags:
      - lists
  /api/v1/findings:
    get:
      description: Findings (scope `finding:write`), filterable by `severity` and
        `status`. Until scanners run, rows are synthetic demo data and `data_source`
        is `synthetic`.
      operationId: listFindings
      parameters:
      - description: Page size (default 25, maximum 100).
        in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size (default 25, maximum 100).
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Opaque cursor from a previous page.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from a previous page.
          title: Cursor
      - in: query
        name: severity
        required: false
        schema:
          anyOf:
          - enum:
            - critical
            - high
            - medium
            - low
            type: string
          - type: 'null'
          title: Severity
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - open
            - in_progress
            - accepted_risk
            - resolved
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Finding_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List findings
      tags:
      - lists
  /api/v1/health:
    get:
      description: Authenticated health summary for operators and monitoring (scope
        `ops:read`). Dependency checks (database, queue) are added as those layers
        are implemented.
      operationId: healthSummary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Health summary
      tags:
      - health
  /api/v1/metrics:
    get:
      description: Gateway request metrics in the Prometheus text format. Requires
        a token with scope `ops:read`; a monitoring identity uses the client-credentials
        flow.
      operationId: metricsExposition
      responses:
        '200':
          content:
            text/plain:
              example: '# HELP aucoff_http_requests_total ...'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Request metrics
      tags:
      - health
  /api/v1/unified-controls:
    get:
      description: The owner-authored unified control catalogue (scope `catalog:read`).
        Filter by `framework` (a requirement maps to it) or `domain`. An empty catalogue
        returns no items.
      operationId: listUnifiedControls
      parameters:
      - description: Page size (default 25, maximum 100).
        in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size (default 25, maximum 100).
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Opaque cursor from a previous page.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from a previous page.
          title: Cursor
      - in: query
        name: framework
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Framework
      - in: query
        name: domain
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UnifiedControl_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List unified controls
      tags:
      - lists
servers:
- description: Local kind cluster (v1)
  url: http://aucoff.localtest.me
tags:
- description: Authenticated health summary and metrics.
  name: health
- description: Dashboards for signed-in users.
  name: dashboards
- description: Controls, findings and evidence lists.
  name: lists
