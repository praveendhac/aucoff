# Defaults. Environment-specific overrides live in values-local.yaml (v1 has no other environment).
global:
  host: aucoff.localtest.me

backend:
  # Probes are exec-based on purpose: no anonymous HTTP endpoint exists (constitution ZT-7).
  probeCommand: ["python", "-m", "app.healthcheck"]
  image:
    repository: aucoff-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  # Exec probe fetches the public static login shell from inside the container (ZT-2 carve-out).
  probeCommand:
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  image:
    repository: aucoff-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

oidc:
  # Keycloak (chart aucoff-identity). The issuer must match the identity chart's `hostname` and
  # every URL is https, verified against the local CA published as the aucoff-identity-ca ConfigMap.
  # Public issuer (identical in every token); keys and tokens are fetched via the service name.
  issuer: https://idp.localtest.me:8443/realms/aucoff
  # Service-name URL for the BFF (backchannel); the browser is sent to the public issuer.
  backchannelIssuer: https://aucoff-keycloak.aucoff-identity.svc:8443/realms/aucoff
  webSecret: aucoff-web-oidc
  webSessionSecret: aucoff-web-session
  jwksUrl: https://aucoff-keycloak.aucoff-identity.svc:8443/realms/aucoff/protocol/openid-connect/certs
  tokenUrl: https://aucoff-keycloak.aucoff-identity.svc:8443/realms/aucoff/protocol/openid-connect/token
  gatewayAudience: aucoff-gateway
  caConfigMap: aucoff-identity-ca
  # Per-service identity for outbound calls (client_id / client_secret keys), made by `make secrets`.
  serviceSecret: aucoff-svc-gateway

database:
  host: aucoff-pg-rw.aucoff-data.svc
  port: 5432
  name: aucoff
  gatewaySecret: aucoff-pg-gateway
  migratorSecret: aucoff-pg-migrator
  caConfigMap: aucoff-pg-ca

ingress:
  enabled: true
  className: traefik

networkPolicy:
  enabled: true
