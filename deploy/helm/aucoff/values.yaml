# Defaults. Environment-specific overrides live in values-local.yaml (v1 has no other environment).
global:
  host: aucoff.localtest.me

backend:
  # Probes are exec-based on purpose: no anonymous HTTP endpoint exists (constitution ZT-7).
  probeCommand: ["python", "-m", "app.healthcheck"]
  image:
    repository: aucoff-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  # Exec probe fetches the public static login shell from inside the container (ZT-2 carve-out).
  probeCommand:
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  image:
    repository: aucoff-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx

networkPolicy:
  enabled: true
