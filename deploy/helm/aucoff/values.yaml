# Defaults. Environment-specific overrides live in values-local.yaml (v1 has no other environment).
global:
  host: aucoff.localtest.me

backend:
  # Probes are exec-based on purpose: no anonymous HTTP endpoint exists (constitution ZT-7).
  probeCommand: ["python", "-m", "app.healthcheck"]
  image:
    repository: aucoff-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  # Exec probe fetches the public static login shell from inside the container (ZT-2 carve-out).
  probeCommand:
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  image:
    repository: aucoff-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

oidc:
  # Keycloak is added in the next build session; until then tokens cannot be issued and every
  # request is rejected with 401 (which is the intended default-deny behaviour, ZT-1).
  issuer: http://aucoff-keycloak:8080/realms/aucoff
  jwksUrl: http://aucoff-keycloak:8080/realms/aucoff/protocol/openid-connect/certs
  gatewayAudience: aucoff-gateway

database:
  host: aucoff-pg-rw.aucoff-data.svc
  port: 5432
  name: aucoff
  gatewaySecret: aucoff-pg-gateway
  migratorSecret: aucoff-pg-migrator
  caConfigMap: aucoff-pg-ca

ingress:
  enabled: true
  className: traefik

networkPolicy:
  enabled: true
