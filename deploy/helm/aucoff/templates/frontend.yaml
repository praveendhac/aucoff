apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucoff-frontend
  labels:
    app.kubernetes.io/name: aucoff-frontend
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aucoff-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aucoff-frontend
        aucoff.io/idp-client: "true"
        {{- include "aucoff.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aucoff.podSecurityContext" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: idp-ca
          configMap:
            name: {{ .Values.oidc.caConfigMap }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: NEXTAUTH_URL
              value: "https://{{ .Values.global.host }}"
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.webSessionSecret }}, key: secret } }
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_BACKCHANNEL_ISSUER
              value: {{ .Values.oidc.backchannelIssuer | quote }}
            - name: OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.webSecret }}, key: client_id } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.webSecret }}, key: client_secret } }
            - name: BACKEND_URL
              value: "https://aucoff-backend:{{ .Values.backend.port }}"
            # Trust the local CA for the identity provider's certificate (ZT-4).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/aucoff/idp-ca/ca.crt
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: idp-ca
              mountPath: /etc/aucoff/idp-ca
              readOnly: true
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.frontend.probeCommand | nindent 16 }}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.frontend.probeCommand | nindent 16 }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "aucoff.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aucoff-frontend
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aucoff-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
