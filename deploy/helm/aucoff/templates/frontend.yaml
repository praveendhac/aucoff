apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucoff-frontend
  labels:
    app.kubernetes.io/name: aucoff-frontend
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aucoff-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aucoff-frontend
        {{- include "aucoff.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aucoff.podSecurityContext" . | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.frontend.probeCommand | nindent 16 }}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.frontend.probeCommand | nindent 16 }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "aucoff.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aucoff-frontend
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aucoff-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
