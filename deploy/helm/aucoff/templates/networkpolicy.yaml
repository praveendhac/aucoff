{{- if .Values.networkPolicy.enabled }}
# Default deny for the release's pods, then explicit allows (specs/infrastructure-spec.md section 4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aucoff-default-deny
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: aucoff
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aucoff-allow-ingress-controller
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: aucoff
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aucoff-allow-frontend-to-backend
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aucoff-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aucoff-frontend
{{- end }}
