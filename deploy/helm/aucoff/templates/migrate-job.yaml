# Database migrations run as the dedicated migrator role, before the app is installed or upgraded
# (database-spec section 7). The runtime gateway role cannot change the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: aucoff-migrate
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aucoff-migrate
        aucoff.io/db-client: "true"
        {{- include "aucoff.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- include "aucoff.podSecurityContext" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-ca
          configMap:
            name: {{ .Values.database.caConfigMap }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: AUCOFF_MIGRATOR_HOST
              value: {{ .Values.database.host | quote }}
            - name: AUCOFF_MIGRATOR_PORT
              value: {{ .Values.database.port | quote }}
            - name: AUCOFF_MIGRATOR_DB
              value: {{ .Values.database.name | quote }}
            - name: AUCOFF_MIGRATOR_CA_FILE
              value: /etc/aucoff/db-ca/ca.crt
            - name: AUCOFF_MIGRATOR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.migratorSecret }}
                  key: username
            - name: AUCOFF_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.migratorSecret }}
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/aucoff/db-ca
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            {{- include "aucoff.containerSecurityContext" . | nindent 12 }}
