apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucoff-backend
  labels:
    app.kubernetes.io/name: aucoff-backend
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aucoff-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aucoff-backend
        {{- include "aucoff.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aucoff.podSecurityContext" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: {{ .Values.backend.port }} }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: {{ .Values.backend.port }} }
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "aucoff.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aucoff-backend
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aucoff-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
