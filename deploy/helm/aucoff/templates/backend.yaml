apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucoff-backend
  labels:
    app.kubernetes.io/name: aucoff-backend
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aucoff-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aucoff-backend
        aucoff.io/db-client: "true"
        {{- include "aucoff.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aucoff.podSecurityContext" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-ca
          configMap:
            name: {{ .Values.database.caConfigMap }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: AUCOFF_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: AUCOFF_OIDC_AUDIENCE
              value: {{ .Values.oidc.gatewayAudience | quote }}
            - name: AUCOFF_OIDC_JWKS_URL
              value: {{ .Values.oidc.jwksUrl | quote }}
            - name: AUCOFF_DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: AUCOFF_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: AUCOFF_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: AUCOFF_DB_CA_FILE
              value: /etc/aucoff/db-ca/ca.crt
            - name: AUCOFF_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.gatewaySecret }}
                  key: username
            - name: AUCOFF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.gatewaySecret }}
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/aucoff/db-ca
              readOnly: true
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.backend.probeCommand | nindent 16 }}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.backend.probeCommand | nindent 16 }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "aucoff.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aucoff-backend
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aucoff-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
