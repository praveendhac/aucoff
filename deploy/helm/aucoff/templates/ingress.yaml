{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aucoff
  labels:
    {{- include "aucoff.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.global.host }}]
      secretName: aucoff-web-tls
  rules:
    - host: {{ .Values.global.host }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: aucoff-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aucoff-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
