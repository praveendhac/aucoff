# Keycloak 26.8.1 (Apache-2.0, licence read from the project LICENSE.txt on 2026-10-19), pinned by digest.
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.1"
  digest: sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244

realm: aucoff
# Token audience the AUCoFF API gateway accepts (ZT-3). Must equal oidc.gatewayAudience in the aucoff chart.
gatewayAudience: aucoff-gateway
# The PUBLIC (frontend) URL: it is the token issuer and where browsers are sent to log in. Browsers
# reach it through `make idp-forward` (localtest.me resolves to 127.0.0.1). Services inside the
# cluster use the service name instead (backchannel), but still see this issuer in every token.
hostname: https://idp.localtest.me:8443
# Redirect URI of the web BFF (Auth.js), used from build session 4.
webRedirectUri: https://aucoff.localtest.me/api/auth/callback/keycloak

database:
  host: aucoff-pg-rw.aucoff-data.svc
  port: 5432
  name: keycloak
  secret: aucoff-pg-keycloak
  caConfigMap: aucoff-pg-ca

# Throwaway clients used only by `make smoke` to prove the API accepts/refuses real tokens. They are
# imported with the realm, so enable them in local environments only (v1 is local-only).
smokeClients: false

# Synthetic local login users (password from `make secrets`, never in git). Local only.
devUsers: false
# One synthetic user per role (password: DEV_USER_PASSWORD from `make secrets`).
devUserList:
  - { username: dev.admin, role: admin }
  - { username: dev.compliance, role: compliance_officer }
  - { username: dev.ciso, role: ciso }
  - { username: dev.engineer, role: engineer }
  - { username: dev.auditor, role: auditor }
  - { username: dev.exec, role: executive }

# Roles (backend-spec section 8) and the API scopes of api-contract section 4. Roles travel in the
# `roles` claim; the gateway turns them into allowed scopes (app/core/rbac.py) and a user token only
# ever carries the intersection of both.
roles: [compliance_officer, auditor, engineer, executive, ciso, admin]
apiScopes:
  - catalog:read
  - mapping:write
  - scope:write
  - assessment:run
  - connector:write
  - evidence:read
  - evidence:write
  - result:review
  - finding:write
  - report:read
  - report:generate
  - audit:read
  - admin:write
  - docs:read
  - ops:read
  - questionnaire:read
  - questionnaire:write
  - questionnaire:approve
  - copilot:use
devTenantId: 00000000-0000-4000-8000-000000000001

resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits: { cpu: "1500m", memory: 1536Mi }
