# Traefik ingress controller for the local kind cluster (replaces ingress-nginx, which was retired
# upstream after March 2026 and no longer receives security fixes; see LICENCES.md / ADR-15).
# Chart: traefik/traefik 42.0.0 (app v3.7.14), installed by `make ingress`.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  # CRDs are needed only for ServersTransport: Traefik re-encrypts to the backend and verifies its
  # certificate against the local CA (constitution ZT-4). No IngressRoute is used.
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false

# No dashboard or API: they would be anonymous endpoints (constitution ZT-1).
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false

ports:
  web:
    hostPort: 80
    # Plain HTTP only redirects to HTTPS; nothing is served on it.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    hostPort: 443

service:
  type: ClusterIP

# Run on the kind control-plane node, which maps host ports 80 and 443 (deploy/kind/kind-config.yaml).
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule


# The pod uses hostPorts 80/443 on the single ingress node, so a surge pod can never schedule:
# replace the old pod first.
updateStrategy:
  type: Recreate
  rollingUpdate: null
