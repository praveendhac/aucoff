# Only the AUCoFF backend pods (gateway and the migration job) and the CloudNativePG operator may
# reach the database pods. NetworkPolicy is defence in depth only; every connection is also
# authenticated with its own credential (ZT-6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aucoff-pg-ingress
  namespace: aucoff-data
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}   # instances of the same cluster (replication)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aucoff
          podSelector:
            matchLabels:
              aucoff.io/db-client: "true"
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aucoff-identity
          podSelector:
            matchLabels:
              aucoff.io/db-client: "true"
      ports:
        - port: 5432
          protocol: TCP
