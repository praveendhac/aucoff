# kind cluster for local v1 development and testing (specs/infrastructure-spec.md section 5a).
# Node image: kind v0.33.0's default, Kubernetes v1.37.0, pinned by digest. CloudNativePG
# image-volume extensions (pgvector) need Kubernetes 1.35+ and containerd 2.1+ (T-004); the
# Kubernetes version satisfies the first, containerd is verified after cluster creation.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aucoff
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
