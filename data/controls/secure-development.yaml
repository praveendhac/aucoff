    ref: 17(c)
    verified: true
- id: UC-SDL-016
  title: Annual authenticated security testing
  description: Applications get source review, vulnerability assessment and penetration testing by qualified people
    at least yearly, with authenticated access.
  domain: secure-development
  severity: high
  check_type: hybrid
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.8.29
    verified: true
  - framework: pci-dss-4.0.1
    ref: 11.4.2
    verified: true
  - framework: rbi-pso-md-2024
    ref: 18(a)
