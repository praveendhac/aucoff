  description: Developers receive secure coding training when they join and on a regular basis.
  domain: secure-development
  severity: medium
  check_type: manual
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.6.3
    verified: true
  - framework: pci-dss-4.0.1
    ref: 6.2.2
    verified: true
- id: UC-SDL-013
