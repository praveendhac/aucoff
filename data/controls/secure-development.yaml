# AI-drafted starter controls (catalogue 0.2.0), own words. `verified: true` on a reference means
# Claude matched it against the owner-supplied document on 2026-10-20; SOC 2 references are
# unverified (no source supplied). Every control is still a draft awaiting owner review.
catalogue_version: 0.2.0
controls:
- id: UC-SDL-001
  title: Protected main branches
  description: Release branches cannot be changed directly, force-pushed or deleted.
  domain: secure-development
  severity: high
  check_type: automated
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.8.32
    verified: true
  - framework: pci-dss-4.0.1
    ref: 6.5.1
    verified: true
  - framework: soc2-2017
    ref: CC8.1
    verified: false
- id: UC-SDL-002
  title: Mandatory code review
  description: Every change is reviewed by someone other than its author before it is merged.
  domain: secure-development
  severity: high
  check_type: automated
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.8.32
    verified: true
  - framework: soc2-2017
    ref: CC8.1
    verified: false
- id: UC-SDL-003
