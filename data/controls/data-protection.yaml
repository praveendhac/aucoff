    verified: true
- id: UC-CRY-016
  title: Visibility of data assets
  description: The organisation can trace where its data assets are and how they move.
  domain: data-protection
  severity: medium
  check_type: manual
  status: draft
  author: Claude (AI draft)
  requirements:
