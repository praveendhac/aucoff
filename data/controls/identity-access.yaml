    ref: CC6.1
    verified: false
- id: UC-IAM-012
  title: Cloud root and break-glass accounts protected
  description: The all-powerful cloud account has no routine use, strong multi-factor protection and monitored sign-ins.
  domain: identity-access
  severity: critical
  check_type: automated
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.8.2
    verified: true
  - framework: rbi-pso-md-2024
    ref: 15(e)
    verified: true
  - framework: soc2-2017
