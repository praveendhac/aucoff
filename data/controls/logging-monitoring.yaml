# AI-drafted starter controls (catalogue 0.1.0). Titles and descriptions are written in our
# own words. Framework references are best-known and UNVERIFIED (refs_verified: false);
# RBI DPSC 2026 references are not filled in. Review each control before approving.
catalogue_version: 0.1.0
controls:
- id: UC-LOG-001
  title: Audit logging on all in-scope systems
  description: Systems that handle sensitive data or administration produce audit logs that are switched
    on.
  domain: logging-monitoring
  severity: high
  check_type: automated
  status: draft
  author: Claude (AI draft)
  refs_verified: false
  requirements:
  - framework: soc2-2017
    ref: CC7.2
  - framework: pci-dss-4.0.1
    ref: 10.2.1
  - framework: iso27001-2022
    ref: A.8.15
- id: UC-LOG-002
  title: Useful audit log content
  description: Each log entry records who did what, to what, when, and with what result.
  domain: logging-monitoring
  severity: medium
  check_type: hybrid
  status: draft
  author: Claude (AI draft)
  refs_verified: false
  requirements:
