  description: Systems that handle sensitive data or administration produce audit logs that are switched on.
  domain: logging-monitoring
  severity: high
  check_type: automated
  status: draft
  author: Claude (AI draft)
  requirements:
  - framework: iso27001-2022
    ref: A.8.15
    verified: true
  - framework: pci-dss-4.0.1
    ref: 10.2.1
    verified: true
  - framework: rbi-pso-md-2024
