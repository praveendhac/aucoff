# CI for AUCoFF v1: build, test, scan. There is NO deployment job (constitution ENV-4: v1 is local-only).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: OpenAPI drift check (APIR-2)
        run: uv run python -m scripts.export_openapi --check
      - name: OpenAPI lint with Spectral (APIR-1)
        run: npx --yes @stoplight/spectral-cli@6 lint openapi.yaml --ruleset .spectral.yaml --fail-severity=warn
      - name: Python licence gate (LIC-5)
        run: uv run python -m scripts.check_licences
      - name: Control catalogue check (T-006)
        run: uv run python -m scripts.check_controls

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm licence gate (LIC-5)
        run: npm run licences
      - name: Production dependency audit
        run: npm run audit:prod

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/aucoff -f deploy/helm/aucoff/values-local.yaml
      - run: helm lint deploy/helm/aucoff-identity -f deploy/helm/aucoff-identity/values-local.yaml
      - name: No anonymous HTTP probes (ZT-7, ZT-8)
        run: |
          if (helm template aucoff deploy/helm/aucoff -f deploy/helm/aucoff/values-local.yaml; helm template aucoff-identity deploy/helm/aucoff-identity -f deploy/helm/aucoff-identity/values-local.yaml) | grep -n httpGet; then
            echo "httpGet probes are not allowed"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI, not the licensed action)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  images:
    # Builds the two application images and scans every image the stack runs with Trivy; fails on
    # fixable HIGH/CRITICAL findings and keeps the CycloneDX SBOMs (constitution SEC-17, LIC-5).
    # The vulnerability database changes daily, so this job can start failing without a code change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make images
      - run: scripts/scan-images.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: build/sbom/
